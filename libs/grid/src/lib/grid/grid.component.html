@if(dataSourceSignal() !== null) {
<table
  mat-table
  [dataSource]="dataSourceSignal()!"
  matSort
  [matSortDisabled]="!sorting()"
>
  <!-- Loop over columns using the native @for block -->
  @for (column of displayedColumns(); track $index) {
  <!-- Define the column -->
  <ng-container [matColumnDef]="column.value">
    <!-- Header cell with a sort header -->
    <th mat-header-cell *matHeaderCellDef mat-sort-header>
      {{ column.label }}
    </th>

    <!-- Data cell for the column -->
    <td mat-cell *matCellDef="let element">{{ element[column.value] }}</td>
  </ng-container>
  }

  <!-- Header and data rows -->
  <tr mat-header-row *matHeaderRowDef="columns()"></tr>
  <tr mat-row *matRowDef="let row; columns: columns()"></tr>
</table>
} @else {
<!-- Display a message if there's no data -->
<p class="text-gray-500 italic">Data source initializing...</p>
}
