name: CI Pipeline

on:
  push:
    branches:
      - master
      - feature/*
      - bugfix/*
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  # The base and head SHAs are dynamically set to ensure NX affected
  # correctly determines the changed files. This is particularly important
  # for pull requests.
  NX_BRANCH_BASE: ${{ github.event.pull_request.base.sha || 'master' }}
  NX_BRANCH_HEAD: ${{ github.sha }}

jobs:
  # This job runs first and performs a full installation of dependencies.
  # Its main purpose is to build the initial cache that other jobs will reuse.
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A fetch-depth of 0 is required for NX affected to
          # compute the diff against the base branch.
          fetch-depth: 0

      - name: Setup Node.js and cache yarn dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn' # This caches the yarn packages in the system cache directory.

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          dotnet-quality: 'ga'
          cache: true
          cache-dependency-path: libs/dotnet-packages-aggregate/packages.lock.json
      - run: dotnet --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Cache Node Modules
        # This step caches the `node_modules` folder. Subsequent jobs will
        # restore this cache, which is much faster than running `yarn install` again.
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache NX computation results
        # This step caches the results of previously run NX commands,
        # ensuring that subsequent commands for unchanged projects are skipped.
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nx-

  # The lint, test, and build jobs now run in parallel.
  # This is the single, unified test job.
  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and restore yarn dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          dotnet-quality: 'ga'
          cache: true
          cache-dependency-path: libs/dotnet-packages-aggregate/packages.lock.json

      - name: Restore Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Restore NX computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Run tests on affected projects
        # We now explicitly set the configuration to 'ci' to ensure predictable behavior.
        run: yarn nx affected --target=test --base=${{ env.NX_BRANCH_BASE }} --head=${{ env.NX_BRANCH_HEAD }} --configuration=ci --exclude=tag:generated-client
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          SkipNSwag: 'True' # This ensures that the NSwag post-build event is skipped during tests.

      - name: Upload test coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage/
            **/TestResults/**

  # Lint job still runs in parallel.
  lint:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and restore yarn dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          dotnet-quality: 'ga'
          cache: true
          cache-dependency-path: libs/dotnet-packages-aggregate/packages.lock.json

      - name: Restore Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Restore NX computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Lint affected projects
        # We now explicitly set the configuration to 'ci' for consistency.
        run: yarn nx affected --target=lint --base=${{ env.NX_BRANCH_BASE }} --head=${{ env.NX_BRANCH_HEAD }} --configuration=ci --exclude=tag:generated-client

  # The build job runs after both lint and test jobs have completed successfully.
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and restore yarn dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          dotnet-quality: 'ga'
          cache: true
          cache-dependency-path: libs/dotnet-packages-aggregate/packages.lock.json

      - name: Restore Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Restore NX computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Run codegen on affected projects
        # We assume the 'codegen' target correctly handles NSwag.
        # We now explicitly set the configuration to 'ci' for consistency.
        run: yarn nx affected --target=codegen --base=${{ env.NX_BRANCH_BASE }} --head=${{ env.NX_BRANCH_HEAD }} --configuration=ci

      - name: Build affected projects
        # This command is the one that was previously failing. We now pass a flag
        # to explicitly skip the NSwag post-build event.
        run: yarn nx affected --target=build --base=${{ env.NX_BRANCH_BASE }} --head=${{ env.NX_BRANCH_HEAD }}
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          SkipNSwag: 'True' # This ensures that the NSwag post-build event is skipped during builds.

  # The E2E job runs after the build job has completed successfully.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js and restore yarn dependencies
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          dotnet-quality: 'ga'
          cache: true
          cache-dependency-path: libs/dotnet-packages-aggregate/packages.lock.json

      - name: Restore Node Modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Restore NX computation cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: ${{ runner.os }}-nx-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-nx-

      - name: Run Cypress E2E tests on affected projects
        uses: cypress-io/github-action@v6
        with:
          start: yarn nx affected --target=e2e --base=${{ env.NX_BRANCH_BASE }} --head=${{ env.NX_BRANCH_HEAD }}

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            **/cypress/videos/**
            **/cypress/screenshots/**
