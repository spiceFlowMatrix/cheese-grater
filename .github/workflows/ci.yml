name: CI Pipeline

on:
  push:
    branches:
      - master
      - feature/*
      - bugfix/*
  pull_request:
    branches:
      - master

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for nx affected to compute Git diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          dotnet-quality: 'ga'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Lint
        run: yarn nx affected:lint

      - name: Run tests on affected projects
        run: yarn nx affected:test --configuration=ci --passWithNoTests
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Upload test coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage/
            **/TestResults/**

      - name: Run Cypress E2E tests on affected projects
        run: yarn nx affected:e2e-ci

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            **/cypress/videos/**
            **/cypress/screenshots/**

      - name: Run codegen on affected projects
        run: yarn nx affected:codegen

      - name: Build affected projects
        run: yarn nx affected:build
